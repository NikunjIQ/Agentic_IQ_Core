[pytest]
# Only tests/. Without this pytest also collects backend/agent/config_test.py,
# whose test_zabbix/test_zammad/... are connection probes taking a `cfg`
# argument — pytest would read that as a missing fixture and report seven
# failures from production code.
testpaths = tests

markers =
    live: touches the real Zabbix/Zammad/Prometheus/OpenSearch/Ceph estate (no token cost)
    llm: calls a Groq model, so it spends the daily token budget

# The default run must never spend tokens. The models are capped per minute AND
# per day (200,000 on gpt-oss-20b), and two full eval runs exhaust the day —
# after which every failure reads as a code regression rather than an empty
# quota. Opting in is a deliberate act; opting out must not be.
addopts = -m "not llm"
